    notes, cleaner/team management, basic booking form (Launch27-branded),
    multiple calendar views, payroll manager with revenue split, automated
    email reminders, customer login portal, booking integrations (WordPress,
    Squarespace, Wix, Facebook), free chat and email support.
  entries:
  - label: Monthly Subscription
    name: base_monthly
    type: flat
    metric: subscription
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: $75/month
    userMultiplied: false
  - label: Annual Subscription
    name: base_annual
    type: flat
    metric: subscription
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: $765/year (15% discount vs monthly)
    userMultiplied: false
  elements:
  - name: Unlimited Users and Bookings
  - name: Customer Database
  - name: Cleaner/Team Management
  - name: Basic Booking Form (L27 Branding)
  - name: Payroll Manager
  - name: Automated Email Reminders
  - name: Customer Login Portal
