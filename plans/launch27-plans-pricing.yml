specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Launch27
providerId: launch27
created: '2026-07-04'
modified: '2026-07-04'
reconciled: false
tags:
- Field Service Management
- Cleaning Services
- Booking
- Plans
description: >-
  Launch27 is sold as a per-account monthly or annual subscription with three
  tiers - Base, Pro, and Plus - each unlocking additional features (premium
  booking form, integrations, SMS, gift cards, mobile app, multi-location,
  referral engine). All tiers include unlimited users and unlimited bookings;
  the tiers differ by feature availability, not by API call volume or seat
  count. The API itself (the Bitbucket-documented REST surface) is not sold or
  metered separately - it is bundled access to the same account data an
  account's paying tier already exposes through the Launch27 web app, and is
  used to power Launch27's own booking widgets and the authenticated customer
  portal. A 14-day free trial is offered on all tiers.
notes: >-
  Pricing captured from https://www.launch27.com/pricing/ on the review date;
  verify current rates and feature lists directly, as SaaS list pricing
  changes without notice and third-party listing sites (G2, Capterra, ITQlick)
  showed some variance from the official page.
sources:
- https://www.launch27.com/pricing/
- https://www.launch27.com/faq/
plans:
- id: launch27-base
