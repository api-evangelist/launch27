description: >-
  FinOps view of Launch27 spend. Launch27 is billed as a flat per-account
  monthly or annual subscription across three tiers (Base/Pro/Plus); it is not
  usage-metered by API call volume, booking count, or seat count - all tiers
  include unlimited users and unlimited bookings. The API itself carries no
  separate charge: it is bundled access used by Launch27's own booking widgets
  and the authenticated customer portal, tied to whichever tier the account
  already pays for. The dominant variable cost most Launch27 customers
  actually track is payment processing (credit card transaction fees on
  customer charges collected through the platform), which is outside
  Launch27's own subscription price and governed by whatever payment
  processor (e.g. Stripe) the account is linked to.
notes: >-
  Per-unit payment-processing rates are not published by Launch27 and are not
  reconciled here; verify current subscription tier pricing on the Launch27
  pricing page and payment processing rates with the linked processor.
