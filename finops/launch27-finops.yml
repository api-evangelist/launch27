meters:
- name: subscription_tier
  description: Monthly or annual flat subscription fee for the account's plan (Base, Pro, or Plus).
  unit: account_months
  aggregation: sum
  dimensions:
  - account
  - plan_tier
- name: payment_processing
  description: >-
    Credit card / online payment transaction fees charged by the linked
    processor (e.g. Stripe) on customer bookings collected through Launch27;
    not a Launch27 API or subscription charge.
  unit: usd
  aggregation: sum
  dimensions:
  - account
  - processor
principles:
- name: Visibility
  description: Track subscription tier and renewal cadence per account; track payment-processing fees separately from the Launch27 subscription invoice.
- name: Allocation
  description: For multi-brand or franchise operators running several Launch27 accounts, allocate each account's subscription and processing fees to its own cost center.
- name: Optimization
  description: >-
    Because tiers are feature-gated rather than usage-metered, optimize by
    matching tier to needed features (SMS, gift cards, multi-location, mobile
    app) rather than by managing API call volume; annual billing carries a
    15% discount versus monthly.
- name: Accountability
  description: Assign an owner for the Launch27 subscription renewal and for the linked payment processor relationship.
