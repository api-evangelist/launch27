actions:
  asyncapiPath: asyncapi/launch27-asyncapi.yml
  apisYmlUpdated: true
  reason: |
    A documented (if minimally so) wss:// channel exists, discovered via the
    account Settings endpoint, so an AsyncAPI document was created to record
    what is and is not known about it rather than treating Launch27 as REST-only.
