aid: launch27
url: https://raw.githubusercontent.com/api-evangelist/launch27/refs/heads/main/apis.yml
name: Launch27
kind: company
description: Launch27 is a booking and scheduling platform for cleaning service
  businesses (maid services), offering online booking, customer/employee/team
  management, recurring scheduling, payments, and marketing tools. Launch27 was
  acquired by Fullsteam Operations in 2019 and continues to operate today as an
  actively sold, independently branded product; Vonigo (a broader field service
  management platform for home service businesses) is a sister brand under the
  same Fullsteam Operations portfolio, acquired separately in 2022 - Launch27 is
  not a Vonigo product line, though the two are frequently compared as
  Fullsteam-owned competitors in the same space. Launch27 publishes a real,
  actively used REST API (currently v2.1, with a deprecated v2.0) documented in
  a public Bitbucket wiki linked from the Launch27 marketing site footer, rather
  than in first-party developer docs at docs.launch27.com. The API is
  multi-tenant, meaning every client account gets its own subdomain
  (e.g. https://acme.launch27.com),
  and covers booking creation/management for non-logged-in and logged-in
  customers, booking-form helper data (services, spots, frequencies, custom
  fields, price estimation), booking policies, and account settings.
